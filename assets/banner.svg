<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <!-- Animated Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#3b82f6;#10b981;#7c3aed" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#ec4899;#8b5cf6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Background Dynamic Waves / Nodes (Background Layer) -->
  <g opacity="0.25">
    <circle cx="200" cy="100" r="180" fill="none" stroke="url(#accentGrad1)" stroke-width="1.5">
      <animate attributeName="r" values="160;200;160" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="300" r="220" fill="none" stroke="url(#accentGrad1)" stroke-width="1.5">
      <animate attributeName="r" values="220;180;220" dur="7s" repeatCount="indefinite" />
    </circle>
    <path d="M-100 250 C 300 150, 700 350, 1300 200" fill="none" stroke="url(#accentGrad1)" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M-100 180 C 400 320, 800 100, 1300 280" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Decorative Top and Bottom Border Glow Lines -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad1)" />
  <rect x="0" y="396" width="1200" height="4" fill="url(#accentGrad1)" />

  <!-- Foreground Pill Tag -->
  <g transform="translate(600, 85)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1f2937" stroke="url(#accentGrad1)" stroke-width="1.5" filter="url(#subtleGlow)" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1.5">
      🚀 ENTERPRISE LLMOPS &amp; PROMPTS
    </text>
  </g>

  <!-- Title (Foreground) -->
  <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Enterprise Prompt Hub
  </text>

  <!-- Subtitle (Foreground) -->
  <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#9ca3af" text-anchor="middle" letter-spacing="0.2">
    Curated Directory of SaaS &amp; Open-Source Prompt Engineering &amp; Observability Platforms
  </text>

  <!-- Feature Chips / Pills (Foreground Layer) -->
  <g transform="translate(600, 310)">
    <!-- Chip 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#161b22" stroke="#374151" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">
        ⚡ Prompt Versioning
      </text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(-110, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#161b22" stroke="#374151" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">
        📊 LLM Observability
      </text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(100, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="8" fill="#161b22" stroke="#374151" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">
        🧪 Evals &amp; Testing
      </text>
    </g>

    <!-- Chip 4 -->
    <g transform="translate(300, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#161b22" stroke="#374151" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">
        🛡️ AI Governance
      </text>
    </g>
  </g>
</svg>
